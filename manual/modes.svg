    <rect x="446" y="164" width="54" height="34" rx="4" fill="#ff7043"/>
    <rect x="504" y="164" width="54" height="34" rx="4" fill="#ffd9c7"/>
    <path d="M574 170 L574 196 M566 188 L574 198 L582 188" stroke="#ff7043" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
