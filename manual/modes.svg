    <rect x="100" y="164" width="50" height="34" rx="4" fill="#cfe3f5"/>
    <rect x="154" y="164" width="50" height="34" rx="4" fill="#ffd9c7"/>
    <rect x="214" y="166" width="48" height="30" rx="15" fill="#f3eee4"/>
  </g>

  <!-- panel 2: keep only -->
  <g>
    <rect x="356" y="60" width="54" height="34" rx="4" fill="#f3eee4" opacity="0.6"/>
    <rect x="424" y="60" width="54" height="34" rx="4" fill="#ff7043"/>
    <rect x="500" y="60" width="54" height="34" rx="4" fill="#f3eee4" opacity="0.6"/>
    <rect x="570" y="60" width="42" height="34" rx="4" fill="#ff7043"/>
