    <rect x="756" y="56" width="66" height="46" rx="6" fill="#ff7043"/>
    <rect x="846" y="56" width="66" height="46" rx="6" fill="#ff7043"/>
    <g stroke="#fffdf8" stroke-width="3" fill="none" opacity="0.85">
