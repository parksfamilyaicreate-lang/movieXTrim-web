<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="three segment processing modes diagram">
  <rect width="960" height="320" rx="20" fill="#fbfaf5"/>

  <!-- panels -->
  <g fill="#fffdf8" stroke="#e7dec9" stroke-width="2">
    <rect x="24" y="24" width="292" height="272" rx="16"/>
    <rect x="334" y="24" width="292" height="272" rx="16"/>
    <rect x="644" y="24" width="292" height="272" rx="16"/>
  </g>

  <!-- panel 1: cut out -->
