    <rect x="760" y="164" width="58" height="42" rx="5" fill="#f3eee4" stroke="#e7dec9" stroke-width="2"/>
    <rect x="850" y="164" width="58" height="42" rx="5" fill="#f3eee4" stroke="#e7dec9" stroke-width="2"/>
    <g fill="#ffb08a">
