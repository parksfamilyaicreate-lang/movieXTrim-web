<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="video editing workspace illustration">
  <rect width="960" height="360" rx="20" fill="#fbfaf5"/>
  <circle cx="72" cy="58" r="7" fill="#ffd9c7"/>
  <circle cx="98" cy="58" r="7" fill="#e7dec9"/>
  <circle cx="124" cy="58" r="7" fill="#cfe3f5"/>

  <!-- monitor -->
  <rect x="205" y="34" width="550" height="250" rx="18" fill="#3c322a"/>
  <rect x="222" y="51" width="516" height="196" rx="9" fill="#fffdf8"/>
  <rect x="240" y="68" width="84" height="12" rx="6" fill="#e7dec9"/>
  <rect x="332" y="68" width="54" height="12" rx="6" fill="#f3eee4"/>
  <rect x="240" y="104" width="156" height="30" rx="6" fill="#ffd9c7"/>
  <rect x="402" y="104" width="104" height="30" rx="6" fill="#cfe3f5"/>
  <rect x="512" y="104" width="190" height="30" rx="6" fill="#ffd9c7"/>
  <rect x="240" y="144" width="96" height="30" rx="6" fill="#e7dec9"/>
  <rect x="342" y="144" width="216" height="30" rx="6" fill="#ffd9c7"/>
  <rect x="564" y="144" width="138" height="30" rx="6" fill="#cfe3f5"/>
  <rect x="240" y="192" width="280" height="10" rx="5" fill="#f3eee4"/>
  <rect x="528" y="192" width="174" height="10" rx="5" fill="#f3eee4"/>
  <!-- playhead -->
  <rect x="487" y="94" width="3" height="116" fill="#ff7043"/>
  <path d="M481 94 L496 94 L488.5 106 Z" fill="#ff7043"/>
  <!-- ruler -->
  <g fill="#d8cdbb">
    <rect x="240" y="216" width="2" height="8"/><rect x="290" y="216" width="2" height="8"/>
    <rect x="340" y="216" width="2" height="8"/><rect x="390" y="216" width="2" height="8"/>
    <rect x="440" y="216" width="2" height="8"/><rect x="490" y="216" width="2" height="8"/>
    <rect x="540" y="216" width="2" height="8"/><rect x="590" y="216" width="2" height="8"/>
    <rect x="640" y="216" width="2" height="8"/><rect x="690" y="216" width="2" height="8"/>
  </g>
  <!-- stand -->
  <rect x="470" y="284" width="20" height="18" fill="#3c322a"/>
  <rect x="425" y="302" width="110" height="8" rx="4" fill="#3c322a"/>

  <!-- curling film strip -->
  <g transform="translate(52 244)">
    <rect x="0" y="0" width="124" height="54" rx="6" fill="#3c322a"/>
    <g fill="#fffdf8">
      <rect x="6" y="6" width="20" height="7" rx="2"/><rect x="36" y="6" width="20" height="7" rx="2"/>
      <rect x="66" y="6" width="20" height="7" rx="2"/><rect x="96" y="6" width="20" height="7" rx="2"/>
      <rect x="6" y="41" width="20" height="7" rx="2"/><rect x="36" y="41" width="20" height="7" rx="2"/>
      <rect x="66" y="41" width="20" height="7" rx="2"/><rect x="96" y="41" width="20" height="7" rx="2"/>
    </g>
    <rect x="10" y="17" width="24" height="20" rx="2" fill="#ffd9c7"/>
    <rect x="38" y="17" width="24" height="20" rx="2" fill="#cfe3f5"/>
    <rect x="66" y="17" width="24" height="20" rx="2" fill="#ffd9c7"/>
    <rect x="94" y="17" width="22" height="20" rx="2" fill="#e7dec9"/>
  </g>

  <!-- scissors -->
  <g transform="translate(820 236)" stroke="#ff7043" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="14" y1="10" x2="62" y2="62"/>
    <line x1="62" y1="10" x2="14" y2="62"/>
    <circle cx="12" cy="66" r="10"/>
    <circle cx="64" cy="66" r="10"/>
  </g>
